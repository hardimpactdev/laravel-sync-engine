name: PHP

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ['8.4', '8.5']
        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: pdo_sqlite
                  coverage: none
            - run: composer install --no-interaction --no-progress
            - run: composer check
